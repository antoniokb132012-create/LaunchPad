
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaunchPad</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #20243a;
    }

    header {
      padding: 22px 8%;
      background: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 12px #0000000a;
    }

    .logo { font-size: 24px; font-weight: bold; color: #6558e8; }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      background: #6558e8;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    main { max-width: 1000px; margin: 60px auto; padding: 0 22px; }

    .hero {
      background: linear-gradient(135deg, #6558e8, #9b78f5);
      color: white;
      padding: 42px;
      border-radius: 24px;
      margin-bottom: 28px;
    }

    .hero h1 { font-size: 38px; margin-top: 0; }
    .hero p { line-height: 1.6; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }

    .card, .tasks {
      background: rgb(179, 222, 241);
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 5px 20px #20243a08;
    }

    .number { font-size: 30px; font-weight: bold; margin: 10px 0; }
    .muted { color: #777d91; }

    .tasks h2 { margin-top: 0; }

    form { display: flex; gap: 10px; margin-bottom: 20px; }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #dce0eb;
      border-radius: 10px;
      font-size: 15px;
    }

    li {
      list-style: none;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    ul { padding: 0; }
    li span { flex: 1; overflow-wrap: anywhere; }
    li.done span { text-decoration: line-through; color: #9297a8; }
    li button { padding: 8px 10px; background: #ecebff; color: #6558e8; }

    .progress { height: 10px; background: #e8e8f2; border-radius: 20px; overflow: hidden; }
    .bar { height: 100%; width: 0; background: #6558e8; transition: width .3s; }

    footer { text-align: center; padding: 30px; color: #777d91; }

    @media (max-width: 500px) {
      .hero { padding: 28px; }
      .hero h1 { font-size: 30px; }
      form { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">✦ LaunchPad</div>
    <button id="themeButton">Dark mode</button>
  </header>

  <main>
    <section class="hero">
      <h1>Your ideas start here.</h1>
      <p>A simple personal dashboard to organise your day, track your tasks, and make progress.</p>
      <button onclick="document.getElementById('taskInput').focus()">Get started →</button>
    </section>

    <section class="cards">
      <div class="card">
        <div class="muted">Total tasks</div>
        <div class="number" id="total">0</div>
      </div>
      <div class="card">
        <div class="muted">Completed</div>
        <div class="number" id="completed">0</div>
      </div>
      <div class="card">
        <div class="muted">Your progress</div>
        <div class="number" id="percent">0%</div>
      </div>
    </section>

    <section class="tasks">
      <h2>My tasks</h2>
      <p class="muted">Small steps make big things happen.</p>
      <form id="taskForm">
        <input id="taskInput" placeholder="What do you want to do?" maxlength="120" required>
        <button type="submit">Add task +</button>
      </form>
      <ul id="taskList"></ul>
      <div class="progress"><div class="bar" id="bar"></div></div>
    </section>
  </main>

  <footer>Made with care · LaunchPad</footer>

  <script>
    let tasks = [];
    try {
      tasks = JSON.parse(localStorage.getItem('launchpad-tasks')) || [];
    } catch (error) {
      tasks = [];
    }

    const taskForm = document.getElementById('taskForm');
    const taskInput = document.getElementById('taskInput');
    const taskList = document.getElementById('taskList');

    function saveTasks() {
      localStorage.setItem('launchpad-tasks', JSON.stringify(tasks));
    }

    function renderTasks() {
      taskList.replaceChildren();

      tasks.forEach((task, index) => {
        const item = document.createElement('li');
        if (task.done) item.classList.add('done');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.done;
        checkbox.setAttribute('aria-label', 'Mark task complete');
        checkbox.addEventListener('change', () => {
          tasks[index].done = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const label = document.createElement('span');
        label.textContent = task.text;

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.textContent = 'Delete';
        remove.addEventListener('click', () => {
          tasks.splice(index, 1);
          saveTasks();
          renderTasks();
        });

        item.append(checkbox, label, remove);
        taskList.append(item);
      });

      const completed = tasks.filter(task => task.done).length;
      const percent = tasks.length ? Math.round(completed / tasks.length * 100) : 0;

      document.getElementById('total').textContent = tasks.length;
      document.getElementById('completed').textContent = completed;
      document.getElementById('percent').textContent = percent + '%';
      document.getElementById('bar').style.width = percent + '%';
    }

    taskForm.addEventListener('submit', event => {
      event.preventDefault();
      const text = taskInput.value.trim();
      if (!text) return;

      tasks.push({ text, done: false });
      saveTasks();
      renderTasks();
      taskInput.value = '';
      taskInput.focus();
    });

    const themeButton = document.getElementById('themeButton');

    themeButton.addEventListener('click', () => {
      const dark = document.body.classList.toggle('dark');
      themeButton.textContent = dark ? 'Light mode' : 'Dark mode';
    });

    const darkStyles = document.createElement('style');
    darkStyles.textContent = `
      body.dark { background: #151625; color: #f4f4ff; }
      body.dark header, body.dark .card, body.dark .tasks {
        background: #22243a; color: #f4f4ff;
      }
      body.dark input { background: #292b42; color: white; border-color: #44465f; }
      body.dark li { border-color: #383a50; }
      body.dark .muted, body.dark footer { color: #b6b9cd; }
      body.dark .progress { background: #383a50; }
    `;
    document.head.append(darkStyles);

    renderTasks();
  </script>
</body>
</html>
